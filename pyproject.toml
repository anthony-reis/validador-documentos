[project]
name = "validador-docs"
version = "0.1.0"
description = "Agente local de validacao de conformidade documental (RAG) para a industria farmaceutica -- TFG"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langgraph>=0.2,<0.3",
    # Fixado <0.3: langchain-ollama >=0.3 puxa langchain-core 1.x, que
    # conflita com langchain/langgraph 0.x fixados acima (checado em 30/08/2026).
    "langchain-ollama>=0.2,<0.3",
    "pymupdf>=1.24,<2.0",
    "pdfplumber>=0.11,<1.0",
    "pandas>=2.2,<3.0",
    "sentence-transformers>=3.0,<4.0",
    # Fixado <1.0: huggingface_hub 1.x quebra compatibilidade com
    # transformers/tokenizers nas versoes usadas aqui (checado em 30/08/2026).
    "huggingface_hub[cli]>=0.23.2,<1.0",
    "chromadb>=0.5,<0.6",
    "rank-bm25>=0.2,<0.3",
    "streamlit>=1.38,<2.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
